services:
  - type: web
    name: orchid-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DISCOS_API_TOKEN
        sync: false
      - key: SPACETRACK_IDENTITY
        sync: false
      - key: SPACETRACK_PASSWORD
        sync: false
      - key: SATNOGS_API_TOKEN
        sync: false

